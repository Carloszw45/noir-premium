name: connect continuity layer

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/connect-continuity.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect V7 assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text()
          if 'continuity.css' not in text:
              text = text.replace('<link rel="stylesheet" href="v5.css?v=6">', '<link rel="stylesheet" href="v5.css?v=6">\n  <link rel="stylesheet" href="continuity.css?v=7">')
          if 'continuity.js' not in text:
              text = text.replace('<script src="script.js?v=6"></script>', '<script src="script.js?v=6"></script>\n<script src="continuity.js?v=7"></script>')
          p.write_text(text)
          PY
      - name: Commit index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Connect NOIR V7 continuity layer"
            git push
          fi
