name: apply hero return fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-hero-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect hero fix and audit path
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text()
          needle = '<script src="script.js"></script>'
          replacement = needle + '\n<script src="hero-return-fix.js"></script>'
          if 'hero-return-fix.js' not in text:
              text = text.replace(needle, replacement)
              index.write_text(text)

          workflow = Path('.github/workflows/visual-audit.yml')
          text = workflow.read_text()
          needle = '      - "script.js"\n'
          replacement = needle + '      - "hero-return-fix.js"\n'
          if 'hero-return-fix.js' not in text:
              text = text.replace(needle, replacement)
              workflow.write_text(text)
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/visual-audit.yml
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Connect hero return fix"
            git push
          fi
