name: connect assets v11

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/connect-assets-v11.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Connect asset layer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          link = '  <link rel="stylesheet" href="assets-v11.css?v=11">\n'
          if 'assets-v11.css' not in s:
              s = s.replace('  <link rel="stylesheet" href="layered-v9.css?v=9">\n', '  <link rel="stylesheet" href="layered-v9.css?v=9">\n' + link)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Connect V11 separated asset layer"
            git push
          fi
