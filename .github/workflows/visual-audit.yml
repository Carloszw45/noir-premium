name: visual audit

on:
  push:
    branches: [main, layered-v9-build]
    paths:
      - "index.html"
      - "style.css"
      - "v5.css"
      - "continuity.css"
      - "layered-v9.css"
      - "script.js"
      - "continuity.js"
      - "package.json"
      - "scripts/**"
      - ".github/workflows/visual-audit.yml"
  workflow_dispatch:

concurrency:
  group: visual-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/noir-server.log 2>&1 &
          echo $! > /tmp/noir-server.pid
          sleep 3

      - name: Capture and validate desktop/mobile
        run: npm run visual:audit

      - name: Upload visual audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noir-visual-audit
          path: visual-audit/
          retention-days: 7
